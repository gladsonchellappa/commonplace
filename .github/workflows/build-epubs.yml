name: Build Commonplace EPUBs

on:
  push:
    branches: [main, master]
    paths:
      - "docs/10.30-1700-ai-pm-knowledge.html"
      - "docs/10.31-1330-ai-harness-engineering.html"
      - "scripts/build_epubs.py"
      - ".github/workflows/build-epubs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip epub]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ebook parser
        run: python -m pip install beautifulsoup4
      - name: Build timestamped EPUB editions
        run: |
          export TZ=Asia/Kolkata
          python scripts/build_epubs.py
      - name: Commit EPUBs and download links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/downloads/*.epub docs/10.30-1700-ai-pm-knowledge.html docs/10.31-1330-ai-harness-engineering.html docs/index.html
          git commit -m "Publish timestamped Kindle EPUB editions [skip epub]" || exit 0
          git push
