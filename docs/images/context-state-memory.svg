<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#52708f" stroke-width="2"/></marker></defs><rect width="1440" height="820" rx="28" fill="#f2f6fb"/><g font-family="Arial,sans-serif" fill="#18334f"><text x="72" y="78" font-size="34" font-weight="bold">Three information systems, three jobs</text><text x="72" y="116" font-size="18" fill="#52677e">Context is assembled for the invocation; task state persists; memory retains reusable knowledge.</text><rect x="65" y="235" width="390" height="370" rx="20" fill="#fff" stroke="#d5e0ec" stroke-width="2"/><rect x="65" y="235" width="390" height="10" rx="5" fill="#7c65bd"/><text x="93" y="295" font-size="24" font-weight="bold">CURRENT CONTEXT</text><text x="93" y="360" font-size="18" fill="#52677e">Loaded for this model turn</text><text x="93" y="408" font-size="18" fill="#52677e">Relevant instructions</text><text x="93" y="456" font-size="18" fill="#52677e">Recent observations</text><text x="93" y="504" font-size="18" fill="#52677e">Selected evidence</text><text x="93" y="552" font-size="18" fill="#52677e">Active decisions</text><rect x="530" y="235" width="390" height="370" rx="20" fill="#fff" stroke="#d5e0ec" stroke-width="2"/><rect x="530" y="235" width="390" height="10" rx="5" fill="#2877bb"/><text x="558" y="295" font-size="24" font-weight="bold">DURABLE TASK STATE</text><text x="558" y="360" font-size="18" fill="#52677e">Survives model invocations</text><text x="558" y="408" font-size="18" fill="#52677e">Objective and status</text><text x="558" y="456" font-size="18" fill="#52677e">Completed and pending work</text><text x="558" y="504" font-size="18" fill="#52677e">Operation IDs and decisions</text><text x="558" y="552" font-size="18" fill="#52677e">Blockers and next action</text><rect x="995" y="235" width="390" height="370" rx="20" fill="#fff" stroke="#d5e0ec" stroke-width="2"/><rect x="995" y="235" width="390" height="10" rx="5" fill="#269b91"/><text x="1023" y="295" font-size="24" font-weight="bold">RETAINED MEMORY</text><text x="1023" y="360" font-size="18" fill="#52677e">Useful across tasks</text><text x="1023" y="408" font-size="18" fill="#52677e">Reusable domain knowledge</text><text x="1023" y="456" font-size="18" fill="#52677e">Prior lessons and patterns</text><text x="1023" y="504" font-size="18" fill="#52677e">Preferences and conventions</text><text x="1023" y="552" font-size="18" fill="#52677e">Provenance and freshness</text><path d="M455 420H530M920 420H995" stroke="#52708f" stroke-width="3" marker-end="url(#a)"/><text x="720" y="680" text-anchor="middle" font-size="21" font-weight="bold">Reconstruct the task, then refresh against authoritative external evidence.</text><text x="72" y="780" font-size="14" fill="#71849a">AI HARNESS ENGINEERING • COMMONPLACE</text></g></svg>