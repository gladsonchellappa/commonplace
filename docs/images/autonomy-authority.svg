<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820"><rect width="1440" height="820" rx="28" fill="#f2f6fb"/><g font-family="Arial,sans-serif" fill="#18334f"><text x="72" y="78" font-size="34" font-weight="bold">Autonomy and authority are independent</text><text x="72" y="116" font-size="18" fill="#52677e">The agent's freedom to decide is not the same as its permission to affect systems.</text><text x="850" y="180" font-size="20" font-weight="bold">AUTHORITY →</text><text x="135" y="470" transform="rotate(-90 135 470)" font-size="20" font-weight="bold">AUTONOMY →</text><rect x="220" y="230" width="520" height="190" rx="18" fill="#f2edff" stroke="#d5e0ec" stroke-width="2"/><rect x="220" y="230" width="9" height="190" rx="4" fill="#7c65bd"/><text x="248" y="285" font-size="21" font-weight="bold">HIGH AUTONOMY / LOW AUTHORITY</text><text x="248" y="335" font-size="18">Investigates, reasons and recommends</text><text x="248" y="370" font-size="18" fill="#52677e">Cannot mutate production</text><rect x="790" y="230" width="520" height="190" rx="18" fill="#e9f7f1" stroke="#d5e0ec" stroke-width="2"/><rect x="790" y="230" width="9" height="190" rx="4" fill="#269b75"/><text x="818" y="285" font-size="21" font-weight="bold">HIGH AUTONOMY / HIGH AUTHORITY</text><text x="818" y="335" font-size="18">Decides and executes</text><text x="818" y="370" font-size="18" fill="#52677e">Within a bounded action envelope</text><rect x="220" y="480" width="520" height="190" rx="18" fill="#f4f6f8" stroke="#d5e0ec" stroke-width="2"/><rect x="220" y="480" width="9" height="190" rx="4" fill="#8293a5"/><text x="248" y="535" font-size="21" font-weight="bold">LOW AUTONOMY / LOW AUTHORITY</text><text x="248" y="585" font-size="18">Read-only scripted workflow</text><text x="248" y="620" font-size="18" fill="#52677e">Limited decision freedom</text><rect x="790" y="480" width="520" height="190" rx="18" fill="#fff4e8" stroke="#d5e0ec" stroke-width="2"/><rect x="790" y="480" width="9" height="190" rx="4" fill="#d18b28"/><text x="818" y="535" font-size="21" font-weight="bold">LOW AUTONOMY / HIGH AUTHORITY</text><text x="818" y="585" font-size="18">Executes a fixed procedure</text><text x="818" y="620" font-size="18" fill="#52677e">Mutation rights narrowly scoped</text><path d="M760 210V690M195 455H1330" stroke="#9bb1c8" stroke-width="2" stroke-dasharray="8 8"/><text x="72" y="790" font-size="14" fill="#71849a">AI HARNESS ENGINEERING • COMMONPLACE</text></g></svg>